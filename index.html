<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./counter/areaHeron.js" defer></script>
    <script src="./counter.js"></script>
</head>
<body>
    <div class="container">
        <h1></h1>
        <div class="counters">
            <section class="counter1">
                <h2>Розрахувати площу трикутника за трьома сторонами за допомогою формули Герона</h2>
                <div class="calculadora">
                    <p>Введіть розміри трьох сторін трикутника</p>
                    <input type="number" id="sideA" placeholder="Side A">
                    <input type="number" id="sideB" placeholder="Side B">
                    <input type="number" id="sideC" placeholder="Side C">
                    <button id="btnCalculate">порахувати</button>
                </div>
                <p>Результат: <span id="result"></span></p>
            </section>
            <section2></section2>
        </div>
    </div>
